<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" height="100%">
  <defs>
    <linearGradient id="privaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091318"/>
      <stop offset="55%" stop-color="#0F1E28"/>
      <stop offset="100%" stop-color="#112224"/>
    </linearGradient>

    <linearGradient id="aiAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <radialGradient id="emeraldGlow" cx="82%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>

    <style>
      .badge-cat { font: 700 11px 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; fill: #34D399; letter-spacing: 1.8px; }
      .card-title { font: 800 30px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #F8FAFC; letter-spacing: -0.5px; }
      .card-desc { font: 400 15px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #CBD5E1; }
      .feat-text { font: 500 13px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #E2E8F0; }
      .tag-text { font: 600 12px 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; fill: #6EE7B7; }
      .mono-ui { font: 600 11.5px 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; }
    </style>
  </defs>

  <!-- Card Background & Border -->
  <rect width="1200" height="260" rx="18" fill="url(#privaBg)"/>
  <rect width="1200" height="260" rx="18" fill="url(#emeraldGlow)"/>
  <rect x="0" y="0" width="6" height="260" rx="3" fill="url(#aiAccent)"/>
  <rect x="1" y="1" width="1198" height="258" rx="17" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.75"/>

  <!-- Left Content -->
  <g transform="translate(44, 34)">
    <!-- Category Header -->
    <rect x="0" y="0" width="320" height="24" rx="6" fill="#10B981" fill-opacity="0.14" stroke="#10B981" stroke-opacity="0.4" stroke-width="1"/>
    <text x="12" y="16" class="badge-cat">ON-DEVICE MOBILE AI · REACT NATIVE</text>

    <!-- Title -->
    <text x="0" y="62" class="card-title">PrivaTalk <tspan font-size="18" font-weight="500" fill="#94A3B8">(100% Local LLM, STT &amp; TTS)</tspan></text>

    <!-- Description -->
    <text x="0" y="92" class="card-desc">
      Privacy-first mobile AI suite running Language Models, Speech-to-Text, and Text-to-Speech entirely
    </text>
    <text x="0" y="114" class="card-desc">
      on-device via ExecuTorch — zero cloud API keys, zero data leakage, full offline inference.
    </text>

    <!-- Feature Grid -->
    <g transform="translate(0, 134)">
      <circle cx="8" cy="-4" r="3.5" fill="#34D399"/>
      <text x="20" y="0" class="feat-text"><tspan font-weight="700" fill="#FFF">Local LLMs:</tspan> Llama 3.2 1B, Qwen3 0.6B, SmolLM2</text>

      <circle cx="380" cy="-4" r="3.5" fill="#38BDF8"/>
      <text x="392" y="0" class="feat-text"><tspan font-weight="700" fill="#FFF">Whisper STT:</tspan> Quantized Tiny/Base/Small mic &amp; audio</text>

      <circle cx="8" cy="22" r="3.5" fill="#34D399"/>
      <text x="20" y="26" class="feat-text"><tspan font-weight="700" fill="#FFF">Kokoro TTS:</tspan> Offline natural neural speech synthesis</text>

      <circle cx="380" cy="22" r="3.5" fill="#38BDF8"/>
      <text x="392" y="26" class="feat-text"><tspan font-weight="700" fill="#FFF">Local Storage &amp; RAG:</tspan> op-sqlite, MMKV &amp; Zustand</text>
    </g>

    <!-- Tech Stack Pills -->
    <g transform="translate(0, 178)">
      <rect x="0" y="0" width="114" height="26" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="57" y="17" text-anchor="middle" class="tag-text">React Native</text>

      <rect x="124" y="0" width="96" height="26" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="172" y="17" text-anchor="middle" class="tag-text">Expo SDK 54</text>

      <rect x="230" y="0" width="104" height="26" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="282" y="17" text-anchor="middle" class="tag-text">ExecuTorch</text>

      <rect x="344" y="0" width="94" height="26" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="391" y="17" text-anchor="middle" class="tag-text">op-sqlite</text>

      <rect x="448" y="0" width="84" height="26" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="490" y="17" text-anchor="middle" class="tag-text">Local RAG</text>

      <rect x="542" y="0" width="76" height="26" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="580" y="17" text-anchor="middle" class="tag-text">MMKV</text>
    </g>
  </g>

  <!-- Right Visual Preview: On-Device AI Model & Voice Pipeline Card -->
  <g transform="translate(825, 26)">
    <rect width="340" height="208" rx="14" fill="#070E12" stroke="#334155" stroke-width="1.2"/>

    <!-- Top Status Bar -->
    <rect x="10" y="10" width="320" height="26" rx="7" fill="#0F172A"/>
    <circle cx="24" cy="23" r="4" fill="#10B981"/>
    <text x="36" y="27" class="mono-ui" fill="#6EE7B7">100% Offline Inference</text>
    <text x="255" y="27" class="mono-ui" fill="#94A3B8">EN / ID</text>

    <!-- Model Cards Stack -->
    <g transform="translate(14, 46)">
      <!-- LLM Row -->
      <rect x="0" y="0" width="312" height="34" rx="7" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <rect x="8" y="7" width="44" height="20" rx="4" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="0.8"/>
      <text x="30" y="21" text-anchor="middle" class="mono-ui" fill="#6EE7B7">LLM</text>
      <text x="62" y="21" class="mono-ui" fill="#F8FAFC">Llama 3.2 1B · Qwen3</text>
      <text x="258" y="21" class="mono-ui" fill="#34D399">READY</text>

      <!-- STT Row -->
      <rect x="0" y="40" width="312" height="34" rx="7" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <rect x="8" y="47" width="44" height="20" rx="4" fill="#38BDF8" fill-opacity="0.2" stroke="#38BDF8" stroke-width="0.8"/>
      <text x="30" y="61" text-anchor="middle" class="mono-ui" fill="#7DD3FC">STT</text>
      <text x="62" y="61" class="mono-ui" fill="#F8FAFC">Whisper Quantized</text>
      <text x="258" y="61" class="mono-ui" fill="#34D399">READY</text>

      <!-- TTS Row -->
      <rect x="0" y="80" width="312" height="34" rx="7" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <rect x="8" y="87" width="44" height="20" rx="4" fill="#C084FC" fill-opacity="0.2" stroke="#C084FC" stroke-width="0.8"/>
      <text x="30" y="101" text-anchor="middle" class="mono-ui" fill="#D8B4FE">TTS</text>
      <text x="62" y="101" class="mono-ui" fill="#F8FAFC">Kokoro Voice Synth</text>
      <text x="258" y="101" class="mono-ui" fill="#34D399">READY</text>
    </g>

    <!-- Bottom Audio Waveform & ExecuTorch Runtime Bar -->
    <g transform="translate(14, 166)">
      <rect width="312" height="30" rx="7" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <!-- Audio Waveform Bars -->
      <g transform="translate(16, 7)" fill="#34D399">
        <rect x="0" y="6" width="3" height="6" rx="1.5"/>
        <rect x="6" y="2" width="3" height="14" rx="1.5"/>
        <rect x="12" y="0" width="3" height="18" rx="1.5"/>
        <rect x="18" y="4" width="3" height="10" rx="1.5"/>
        <rect x="24" y="1" width="3" height="16" rx="1.5"/>
        <rect x="30" y="5" width="3" height="8" rx="1.5"/>
        <rect x="36" y="3" width="3" height="12" rx="1.5"/>
        <rect x="42" y="6" width="3" height="6" rx="1.5"/>
      </g>
      <text x="74" y="19" class="mono-ui" fill="#E2E8F0">ExecuTorch · Zero Cloud Latency</text>
    </g>
  </g>
</svg>
