<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" height="100%">
  <defs>
    <clipPath id="cardClip">
      <rect width="1200" height="220" rx="14"/>
    </clipPath>

    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#0F1D22"/>
    </linearGradient>

    <style>
      .repo-owner { font: 400 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #8B949E; }
      .repo-name { font: 700 22px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #58A6FF; }
      .desc { font: 400 14.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #C9D1D9; }
      .meta { font: 500 12.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #8B949E; }
      .pill { font: 500 12px 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; fill: #6EE7B7; }
      .mono-sm { font: 500 11px 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; }
    </style>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="1200" height="220" fill="url(#bg)"/>
    <rect x="0" y="0" width="4" height="220" fill="#10B981"/>

    <!-- Left Content -->
    <g transform="translate(36, 32)">
      <!-- Repo Icon & Title -->
      <g transform="translate(0, 0)">
        <path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8ZM5 12.25a.25.25 0 0 1 .25-.25h3.5a.25.25 0 0 1 .25.25v3.25a.25.25 0 0 1-.4.2l-1.45-1.087a.249.249 0 0 0-.3 0L5.4 15.7a.25.25 0 0 1-.4-.2Z" fill="#8B949E" transform="translate(0, 4) scale(1.2)"/>
        <text x="28" y="19" class="repo-owner">pandutimurbhaskara / <tspan class="repo-name">PrivaTalk</tspan></text>
      </g>

      <!-- Natural Description -->
      <text x="0" y="54" class="desc">
        React Native &amp; Expo app for running local AI models directly on a phone offline.
      </text>
      <text x="0" y="76" class="desc">
        Includes local chat with Llama 3.2, Qwen3, and SmolLM2, audio transcription with quantized
      </text>
      <text x="0" y="98" class="desc">
        Whisper models, and voice synthesis with Kokoro TTS powered by ExecuTorch.
      </text>

      <!-- Bottom Language & Feature Pills -->
      <g transform="translate(0, 128)">
        <circle cx="6" cy="13" r="6" fill="#61DAFB"/>
        <text x="18" y="17.5" class="meta">React Native</text>

        <rect x="116" y="0" width="92" height="26" rx="6" fill="#161F30" stroke="#30363D" stroke-width="1"/>
        <text x="162" y="17" text-anchor="middle" class="pill">Expo SDK 54</text>

        <rect x="216" y="0" width="98" height="26" rx="6" fill="#161F30" stroke="#30363D" stroke-width="1"/>
        <text x="265" y="17" text-anchor="middle" class="pill">ExecuTorch</text>

        <rect x="322" y="0" width="106" height="26" rx="6" fill="#161F30" stroke="#30363D" stroke-width="1"/>
        <text x="375" y="17" text-anchor="middle" class="pill">Whisper STT</text>

        <rect x="436" y="0" width="98" height="26" rx="6" fill="#161F30" stroke="#30363D" stroke-width="1"/>
        <text x="485" y="17" text-anchor="middle" class="pill">Kokoro TTS</text>

        <rect x="542" y="0" width="88" height="26" rx="6" fill="#161F30" stroke="#30363D" stroke-width="1"/>
        <text x="586" y="17" text-anchor="middle" class="pill">op-sqlite</text>
      </g>
    </g>

    <!-- Right Preview Panel -->
    <g transform="translate(836, 22)">
      <rect width="336" height="176" rx="10" fill="#090D14" stroke="#21262D" stroke-width="1.2"/>

      <!-- Header -->
      <rect x="10" y="10" width="316" height="24" rx="5" fill="#111722"/>
      <circle cx="22" cy="22" r="3.5" fill="#10B981"/>
      <text x="32" y="26" class="mono-sm" fill="#6EE7B7">On-Device Models</text>
      <text x="316" y="26" text-anchor="end" class="mono-sm" fill="#8B949E">EN / ID</text>

      <!-- Models List -->
      <g transform="translate(10, 42)">
        <rect x="0" y="0" width="316" height="26" rx="5" fill="#0F1722" stroke="#1E293B" stroke-width="1"/>
        <text x="12" y="17" class="mono-sm" fill="#34D399">LLM</text>
        <text x="52" y="17" class="mono-sm" fill="#C9D1D9">Llama 3.2 1B · Qwen3 0.6B</text>

        <rect x="0" y="31" width="316" height="26" rx="5" fill="#0F1722" stroke="#1E293B" stroke-width="1"/>
        <text x="12" y="48" class="mono-sm" fill="#38BDF8">STT</text>
        <text x="52" y="48" class="mono-sm" fill="#C9D1D9">Whisper Tiny / Base / Small</text>

        <rect x="0" y="62" width="316" height="26" rx="5" fill="#0F1722" stroke="#1E293B" stroke-width="1"/>
        <text x="12" y="79" class="mono-sm" fill="#C084FC">TTS</text>
        <text x="52" y="79" class="mono-sm" fill="#C9D1D9">Kokoro Small &amp; Medium</text>
      </g>

      <!-- Bottom Runtime -->
      <g transform="translate(10, 138)">
        <rect width="316" height="28" rx="5" fill="#111722"/>
        <text x="12" y="18" class="mono-sm" fill="#8B949E">react-native-executorch · op-sqlite · MMKV</text>
      </g>
    </g>

    <rect x="0.75" y="0.75" width="1198.5" height="218.5" rx="13.25" fill="none" stroke="#30363D" stroke-width="1.5"/>
  </g>
</svg>
