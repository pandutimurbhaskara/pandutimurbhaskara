<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" height="100%">
  <defs>
    <linearGradient id="calcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C101C"/>
      <stop offset="55%" stop-color="#13192B"/>
      <stop offset="100%" stop-color="#1E162B"/>
    </linearGradient>

    <linearGradient id="swiftAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="50%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <linearGradient id="curveFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="orangeGlow" cx="82%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>

    <style>
      .badge-cat { font: 700 11px 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; fill: #FB923C; letter-spacing: 1.8px; }
      .card-title { font: 800 30px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #F8FAFC; letter-spacing: -0.5px; }
      .card-desc { font: 400 15px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #CBD5E1; }
      .feat-text { font: 500 13px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #E2E8F0; }
      .tag-text { font: 600 12px 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; fill: #FDBA74; }
      .mono-ui { font: 600 11.5px 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; }
    </style>
  </defs>

  <!-- Card Background & Border -->
  <rect width="1200" height="260" rx="18" fill="url(#calcBg)"/>
  <rect width="1200" height="260" rx="18" fill="url(#orangeGlow)"/>
  <rect x="0" y="0" width="6" height="260" rx="3" fill="url(#swiftAccent)"/>
  <rect x="1" y="1" width="1198" height="258" rx="17" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.75"/>

  <!-- Left Content -->
  <g transform="translate(44, 34)">
    <!-- Category Header -->
    <rect x="0" y="0" width="272" height="24" rx="6" fill="#F97316" fill-opacity="0.14" stroke="#F97316" stroke-opacity="0.4" stroke-width="1"/>
    <text x="12" y="16" class="badge-cat">NATIVE MACOS &amp; IOS · SWIFT 6.0</text>

    <!-- Title -->
    <text x="0" y="62" class="card-title">CalculatorSwift <tspan font-size="18" font-weight="500" fill="#94A3B8">(CalculatorPro)</tspan></text>

    <!-- Description -->
    <text x="0" y="92" class="card-desc">
      Scientific computation suite &amp; custom math engine in SwiftUI with arbitrary-precision arithmetic,
    </text>
    <text x="0" y="114" class="card-desc">
      interactive 2D/3D function graphing, symbolic/numeric calculus, linear algebra, and statistical workspaces.
    </text>

    <!-- Feature Grid -->
    <g transform="translate(0, 134)">
      <circle cx="8" cy="-4" r="3.5" fill="#FB923C"/>
      <text x="20" y="0" class="feat-text"><tspan font-weight="700" fill="#FFF">BigNum Engine:</tspan> Custom BigInt, BigDecimal &amp; Rational</text>

      <circle cx="380" cy="-4" r="3.5" fill="#FB923C"/>
      <text x="392" y="0" class="feat-text"><tspan font-weight="700" fill="#FFF">2D &amp; 3D Graphing:</tspan> Real-time surface &amp; curve plots</text>

      <circle cx="8" cy="22" r="3.5" fill="#FB923C"/>
      <text x="20" y="26" class="feat-text"><tspan font-weight="700" fill="#FFF">6 Workspaces:</tspan> Calc, Matrix, Calculus, Stats, 2D, 3D</text>

      <circle cx="380" cy="22" r="3.5" fill="#FB923C"/>
      <text x="392" y="26" class="feat-text"><tspan font-weight="700" fill="#FFF">Parser &amp; Units:</tspan> Full AST lexer/parser &amp; unit system</text>
    </g>

    <!-- Tech Stack Pills -->
    <g transform="translate(0, 178)">
      <rect x="0" y="0" width="88" height="26" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="44" y="17" text-anchor="middle" class="tag-text">Swift 6.0</text>

      <rect x="98" y="0" width="84" height="26" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="140" y="17" text-anchor="middle" class="tag-text">SwiftUI</text>

      <rect x="192" y="0" width="124" height="26" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="254" y="17" text-anchor="middle" class="tag-text">Swift Package</text>

      <rect x="326" y="0" width="142" height="26" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="397" y="17" text-anchor="middle" class="tag-text">macOS 14 / iOS 17</text>

      <rect x="478" y="0" width="120" height="26" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="538" y="17" text-anchor="middle" class="tag-text">XCTest Suite</text>
    </g>
  </g>

  <!-- Right Visual Preview: Mini Scientific & 2D/3D Graph UI -->
  <g transform="translate(825, 26)">
    <rect width="340" height="208" rx="14" fill="#090D16" stroke="#334155" stroke-width="1.2"/>

    <!-- Top Workspace Tabs -->
    <rect x="10" y="10" width="320" height="26" rx="7" fill="#111827"/>
    <rect x="14" y="13" width="56" height="20" rx="5" fill="#1E293B"/>
    <text x="42" y="27" text-anchor="middle" class="mono-ui" fill="#94A3B8">Calc</text>
    <rect x="74" y="13" width="64" height="20" rx="5" fill="#1E293B"/>
    <text x="106" y="27" text-anchor="middle" class="mono-ui" fill="#94A3B8">Matrix</text>
    <rect x="142" y="13" width="72" height="20" rx="5" fill="#1E293B"/>
    <text x="178" y="27" text-anchor="middle" class="mono-ui" fill="#94A3B8">Calculus</text>
    <rect x="218" y="13" width="106" height="20" rx="5" fill="#F97316" fill-opacity="0.22" stroke="#F97316" stroke-width="1"/>
    <text x="271" y="27" text-anchor="middle" class="mono-ui" fill="#FDBA74">Graph 2D/3D</text>

    <!-- Plot Coordinate Area -->
    <g transform="translate(14, 46)">
      <rect width="312" height="110" rx="8" fill="#0D1322" stroke="#1E293B" stroke-width="1"/>
      <!-- Grid lines -->
      <line x1="0" y1="27.5" x2="312" y2="27.5" stroke="#1E293B" stroke-dasharray="3,3"/>
      <line x1="0" y1="55" x2="312" y2="55" stroke="#334155"/>
      <line x1="0" y1="82.5" x2="312" y2="82.5" stroke="#1E293B" stroke-dasharray="3,3"/>
      <line x1="78" y1="0" x2="78" y2="110" stroke="#1E293B" stroke-dasharray="3,3"/>
      <line x1="156" y1="0" x2="156" y2="110" stroke="#334155"/>
      <line x1="234" y1="0" x2="234" y2="110" stroke="#1E293B" stroke-dasharray="3,3"/>

      <!-- Secondary 3D/Cosine Wave -->
      <path d="M 0 75 Q 39 15, 78 55 T 156 55 T 234 55 T 312 35" fill="none" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.7"/>

      <!-- Primary Sine/Damped Function Curve -->
      <path d="M 0 85 C 40 85, 65 20, 105 20 C 145 20, 165 90, 205 90 C 245 90, 275 30, 312 30 L 312 110 L 0 110 Z" fill="url(#curveFill)"/>
      <path d="M 0 85 C 40 85, 65 20, 105 20 C 145 20, 165 90, 205 90 C 245 90, 275 30, 312 30" fill="none" stroke="#FB923C" stroke-width="2.5"/>

      <!-- Tangents / Critical Points -->
      <circle cx="105" cy="20" r="4" fill="#F97316" stroke="#FFF" stroke-width="1.5"/>
      <circle cx="205" cy="90" r="4" fill="#F97316" stroke="#FFF" stroke-width="1.5"/>

      <!-- Formula Overlay -->
      <rect x="8" y="8" width="164" height="22" rx="4" fill="#090D16" fill-opacity="0.85" stroke="#334155" stroke-width="0.8"/>
      <text x="16" y="23" class="mono-ui" fill="#FDBA74">f(x) = sin(x)·e^(-x/5)</text>
    </g>

    <!-- Bottom Symbolic / BigNum Readout Bar -->
    <g transform="translate(14, 164)">
      <rect width="196" height="32" rx="7" fill="#111827" stroke="#1E293B" stroke-width="1"/>
      <text x="10" y="20" class="mono-ui" fill="#E2E8F0">∫₀^π sin(x)dx = <tspan fill="#34D399">2.000000</tspan></text>

      <rect x="204" y="0" width="108" height="32" rx="7" fill="#111827" stroke="#1E293B" stroke-width="1"/>
      <text x="258" y="20" text-anchor="middle" class="mono-ui" fill="#38BDF8">det(A) = 42</text>
    </g>
  </g>
</svg>
