<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" height="100%">
  <defs>
    <clipPath id="cardClip">
      <rect width="1200" height="220" rx="14"/>
    </clipPath>

    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#131926"/>
    </linearGradient>

    <linearGradient id="curveFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </linearGradient>

    <style>
      .repo-owner { font: 400 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #8B949E; }
      .repo-name { font: 700 22px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #58A6FF; }
      .desc { font: 400 14.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #C9D1D9; }
      .meta { font: 500 12.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #8B949E; }
      .pill { font: 500 12px 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; fill: #FDBA74; }
      .mono-sm { font: 500 11px 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; }
    </style>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="1200" height="220" fill="url(#bg)"/>
    <rect x="0" y="0" width="4" height="220" fill="#F97316"/>

    <!-- Left Content -->
    <g transform="translate(36, 32)">
      <!-- Repo Icon & Title -->
      <g transform="translate(0, 0)">
        <path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8ZM5 12.25a.25.25 0 0 1 .25-.25h3.5a.25.25 0 0 1 .25.25v3.25a.25.25 0 0 1-.4.2l-1.45-1.087a.249.249 0 0 0-.3 0L5.4 15.7a.25.25 0 0 1-.4-.2Z" fill="#8B949E" transform="translate(0, 4) scale(1.2)"/>
        <text x="28" y="19" class="repo-owner">pandutimurbhaskara / <tspan class="repo-name">CalculatorSwift</tspan></text>
      </g>

      <!-- Natural Description -->
      <text x="0" y="54" class="desc">
        Scientific calculator for macOS &amp; iOS built from scratch in Swift 6 and SwiftUI.
      </text>
      <text x="0" y="76" class="desc">
        Includes a custom BigInt/BigDecimal/Rational math engine, expression parser, and workspaces
      </text>
      <text x="0" y="98" class="desc">
        for matrices, calculus, statistics, and 2D/3D function plotting.
      </text>

      <!-- Bottom Language & Feature Pills -->
      <g transform="translate(0, 128)">
        <circle cx="6" cy="13" r="6" fill="#F05138"/>
        <text x="18" y="17.5" class="meta">Swift 6.0</text>

        <rect x="92" y="0" width="78" height="26" rx="6" fill="#161F30" stroke="#30363D" stroke-width="1"/>
        <text x="131" y="17" text-anchor="middle" class="pill">SwiftUI</text>

        <rect x="178" y="0" width="120" height="26" rx="6" fill="#161F30" stroke="#30363D" stroke-width="1"/>
        <text x="238" y="17" text-anchor="middle" class="pill">BigNum Engine</text>

        <rect x="306" y="0" width="132" height="26" rx="6" fill="#161F30" stroke="#30363D" stroke-width="1"/>
        <text x="372" y="17" text-anchor="middle" class="pill">2D &amp; 3D Graphs</text>

        <rect x="446" y="0" width="150" height="26" rx="6" fill="#161F30" stroke="#30363D" stroke-width="1"/>
        <text x="521" y="17" text-anchor="middle" class="pill">Matrix &amp; Calculus</text>
      </g>
    </g>

    <!-- Right Preview Panel -->
    <g transform="translate(836, 22)">
      <rect width="336" height="176" rx="10" fill="#090D14" stroke="#21262D" stroke-width="1.2"/>

      <!-- Workspace Header -->
      <rect x="10" y="10" width="316" height="24" rx="5" fill="#111722"/>
      <text x="20" y="26" class="mono-sm" fill="#8B949E">Calc  ·  Matrix  ·  Calculus  ·  Stats</text>
      <text x="316" y="26" text-anchor="end" class="mono-sm" fill="#FB923C">Graph 2D/3D</text>

      <!-- Plot Area -->
      <g transform="translate(10, 42)">
        <rect width="316" height="88" rx="6" fill="#0D131F" stroke="#1E293B" stroke-width="1"/>
        <line x1="0" y1="44" x2="316" y2="44" stroke="#1E293B"/>
        <line x1="158" y1="0" x2="158" y2="88" stroke="#1E293B"/>

        <path d="M 0 70 C 45 70, 75 30, 115 30 C 155 30, 175 74, 215 74 C 255 74, 280 34, 316 34 L 316 88 L 0 88 Z" fill="url(#curveFill)"/>
        <path d="M 0 70 C 45 70, 75 30, 115 30 C 155 30, 175 74, 215 74 C 255 74, 280 34, 316 34" fill="none" stroke="#FB923C" stroke-width="2.2"/>
        <circle cx="115" cy="30" r="3.5" fill="#F97316" stroke="#FFF" stroke-width="1.2"/>
        <text x="10" y="17" class="mono-sm" fill="#FDBA74">f(x) = sin(x) · e^(-x/5)</text>
      </g>

      <!-- Bottom Readout -->
      <g transform="translate(10, 138)">
        <rect width="316" height="28" rx="5" fill="#111722"/>
        <text x="12" y="18" class="mono-sm" fill="#C9D1D9">∫₀^π sin(x) dx = <tspan fill="#34D399">2</tspan></text>
        <text x="304" y="18" text-anchor="end" class="mono-sm" fill="#58A6FF">macOS 14+ · iOS 17+</text>
      </g>
    </g>

    <rect x="0.75" y="0.75" width="1198.5" height="218.5" rx="13.25" fill="none" stroke="#30363D" stroke-width="1.5"/>
  </g>
</svg>
