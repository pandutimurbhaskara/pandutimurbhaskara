<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" height="100%">
  <defs>
    <clipPath id="cardClip">
      <rect width="1200" height="220" rx="14"/>
    </clipPath>

    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#151828"/>
    </linearGradient>

    <style>
      .repo-owner { font: 400 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #8B949E; }
      .repo-name { font: 700 22px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #58A6FF; }
      .desc { font: 400 14.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #C9D1D9; }
      .meta { font: 500 12.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #8B949E; }
      .pill { font: 500 12px 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; fill: #F9A8D4; }
      .mono-sm { font: 500 11px 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; }
    </style>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="1200" height="220" fill="url(#bg)"/>
    <rect x="0" y="0" width="4" height="220" fill="#F472B6"/>

    <!-- Left Content -->
    <g transform="translate(36, 32)">
      <!-- Repo Icon & Title -->
      <g transform="translate(0, 0)">
        <path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8ZM5 12.25a.25.25 0 0 1 .25-.25h3.5a.25.25 0 0 1 .25.25v3.25a.25.25 0 0 1-.4.2l-1.45-1.087a.249.249 0 0 0-.3 0L5.4 15.7a.25.25 0 0 1-.4-.2Z" fill="#8B949E" transform="translate(0, 4) scale(1.2)"/>
        <text x="28" y="19" class="repo-owner">pandutimurbhaskara / <tspan class="repo-name">pastel-tycoon</tspan></text>
      </g>

      <!-- Natural Description -->
      <text x="0" y="54" class="desc">
        Small browser transport game inspired by OpenTTD and Package Inc.
      </text>
      <text x="0" y="76" class="desc">
        Lay road and rail networks, set up one-way block signals and passing loops, route cargo
      </text>
      <text x="0" y="98" class="desc">
        between mines, sawmills, and towns, and listen to a live Web Audio synth jukebox.
      </text>

      <!-- Bottom Language & Feature Pills -->
      <g transform="translate(0, 128)">
        <circle cx="6" cy="13" r="6" fill="#3178C6"/>
        <text x="18" y="17.5" class="meta">TypeScript</text>

        <rect x="104" y="0" width="84" height="26" rx="6" fill="#161F30" stroke="#30363D" stroke-width="1"/>
        <text x="146" y="17" text-anchor="middle" class="pill">Three.js</text>

        <rect x="196" y="0" width="110" height="26" rx="6" fill="#161F30" stroke="#30363D" stroke-width="1"/>
        <text x="251" y="17" text-anchor="middle" class="pill">Vite + Vitest</text>

        <rect x="314" y="0" width="116" height="26" rx="6" fill="#161F30" stroke="#30363D" stroke-width="1"/>
        <text x="372" y="17" text-anchor="middle" class="pill">Web Audio API</text>

        <rect x="438" y="0" width="166" height="26" rx="6" fill="#161F30" stroke="#30363D" stroke-width="1"/>
        <text x="521" y="17" text-anchor="middle" class="pill">Rail &amp; Block Signals</text>
      </g>
    </g>

    <!-- Right Preview Panel -->
    <g transform="translate(836, 22)">
      <rect width="336" height="176" rx="10" fill="#090D14" stroke="#21262D" stroke-width="1.2"/>

      <!-- Top Bar -->
      <rect x="10" y="10" width="316" height="24" rx="5" fill="#111722"/>
      <text x="20" y="26" class="mono-sm" fill="#34D399">+$14,820</text>
      <text x="95" y="26" class="mono-sm" fill="#8B949E">Yr 3 · M 08</text>
      <text x="316" y="26" text-anchor="end" class="mono-sm" fill="#F472B6">♪ Jukebox (5 tracks)</text>

      <!-- Map Area -->
      <g transform="translate(10, 42)">
        <rect width="316" height="88" rx="6" fill="#0F1726" stroke="#1E293B" stroke-width="1"/>
        <line x1="0" y1="44" x2="316" y2="44" stroke="#182235"/>
        <line x1="105" y1="0" x2="105" y2="88" stroke="#182235"/>
        <line x1="210" y1="0" x2="210" y2="88" stroke="#182235"/>

        <!-- Track -->
        <path d="M 36 66 L 136 66 Q 158 66, 158 44 L 158 26 L 272 26" fill="none" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>

        <!-- Stations & Train -->
        <rect x="18" y="52" width="42" height="22" rx="4" fill="#6EE7B7"/>
        <text x="39" y="67" text-anchor="middle" class="mono-sm" fill="#064E3B">MINE</text>

        <rect x="248" y="14" width="48" height="22" rx="4" fill="#C4B5FD"/>
        <text x="272" y="29" text-anchor="middle" class="mono-sm" fill="#2E1065">PLANT</text>

        <rect x="82" y="59" width="24" height="14" rx="3" fill="#F472B6"/>
        <rect x="110" y="59" width="18" height="14" rx="3" fill="#FBCFE8"/>
        <circle cx="158" cy="44" r="5" fill="#0D1117" stroke="#34D399" stroke-width="1.5"/>
        <circle cx="158" cy="44" r="2" fill="#34D399"/>
      </g>

      <!-- Bottom Controls -->
      <g transform="translate(10, 138)">
        <rect width="316" height="28" rx="5" fill="#111722"/>
        <text x="12" y="18" class="mono-sm" fill="#8B949E">[2] Road   [3] Rail   [5] Station   [8] Signal</text>
      </g>
    </g>

    <rect x="0.75" y="0.75" width="1198.5" height="218.5" rx="13.25" fill="none" stroke="#30363D" stroke-width="1.5"/>
  </g>
</svg>
