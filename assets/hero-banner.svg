<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>

    <radialGradient id="glowBlue" cx="85%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowPink" cx="15%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1" stroke-opacity="0.65"/>
    </pattern>

    <style>
      .greeting { font: 600 14px 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; fill: #38BDF8; letter-spacing: 2.5px; }
      .name { font: 800 44px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: url(#titleGrad); letter-spacing: -0.8px; }
      .role { font: 500 20px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #94A3B8; }
      .role-highlight { fill: #E2E8F0; font-weight: 600; }
      .pill-text { font: 600 12.5px 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; fill: #E2E8F0; }
      .meta-text { font: 500 13.5px system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #94A3B8; }
      .code-title { font: 600 12px 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; fill: #94A3B8; }
      .code-line { font: 500 12.5px 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 0.95; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      .pulse { animation: pulseGlow 4s ease-in-out infinite; }
      .float-card { animation: floatSlow 6s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Main Card Background -->
  <rect width="1200" height="340" rx="20" fill="url(#bgGrad)"/>
  <rect width="1200" height="340" rx="20" fill="url(#grid)"/>
  <rect width="1200" height="340" rx="20" fill="url(#glowBlue)" class="pulse"/>
  <rect width="1200" height="340" rx="20" fill="url(#glowPink)"/>

  <!-- Top Accent Line -->
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#accentGrad)"/>

  <!-- Outer Border -->
  <rect x="1" y="1" width="1198" height="338" rx="19" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- Left Content Area -->
  <g transform="translate(56, 54)">
    <!-- Status / Greeting Badge -->
    <rect x="0" y="0" width="286" height="28" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
    <circle cx="16" cy="14" r="4.5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="30" y="18.5" class="greeting">HELLO WORLD, I'M PANDU</text>

    <!-- Name -->
    <text x="0" y="78" class="name">Pandu Timur Bhaskara</text>

    <!-- Subtitle / Role -->
    <text x="0" y="114" class="role">
      <tspan class="role-highlight">Fullstack &amp; Mobile Engineer</tspan> · Crafting Native, Web, 3D &amp; On-Device AI Apps
    </text>

    <!-- Location & Company Info -->
    <g transform="translate(0, 138)">
      <!-- Company -->
      <rect x="0" y="0" width="175" height="30" rx="8" fill="#1E293B" fill-opacity="0.65" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="15" r="4" fill="#38BDF8"/>
      <text x="28" y="19.5" class="meta-text">Engineer @ <tspan fill="#F8FAFC" font-weight="600">Nanovest</tspan></text>

      <!-- Location -->
      <rect x="187" y="0" width="182" height="30" rx="8" fill="#1E293B" fill-opacity="0.65" stroke="#334155" stroke-width="1"/>
      <circle cx="203" cy="15" r="4" fill="#F472B6"/>
      <text x="215" y="19.5" class="meta-text">Yogyakarta, ID</text>
    </g>

    <!-- Tech Focus Pills -->
    <g transform="translate(0, 194)">
      <g transform="translate(0, 0)">
        <rect width="144" height="32" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1"/>
        <text x="72" y="20.5" text-anchor="middle" class="pill-text" fill="#7DD3FC">React &amp; RN / Expo</text>
      </g>
      <g transform="translate(156, 0)">
        <rect width="136" height="32" rx="8" fill="#0F172A" stroke="#FB923C" stroke-opacity="0.45" stroke-width="1"/>
        <text x="68" y="20.5" text-anchor="middle" class="pill-text" fill="#FDBA74">Swift &amp; Kotlin</text>
      </g>
      <g transform="translate(304, 0)">
        <rect width="142" height="32" rx="8" fill="#0F172A" stroke="#818CF8" stroke-opacity="0.45" stroke-width="1"/>
        <text x="71" y="20.5" text-anchor="middle" class="pill-text" fill="#A5B4FC">TypeScript &amp; Go</text>
      </g>
      <g transform="translate(458, 0)">
        <rect width="134" height="32" rx="8" fill="#0F172A" stroke="#34D399" stroke-opacity="0.45" stroke-width="1"/>
        <text x="67" y="20.5" text-anchor="middle" class="pill-text" fill="#6EE7B7">On-Device AI</text>
      </g>
      <g transform="translate(604, 0)">
        <rect width="128" height="32" rx="8" fill="#0F172A" stroke="#F472B6" stroke-opacity="0.45" stroke-width="1"/>
        <text x="64" y="20.5" text-anchor="middle" class="pill-text" fill="#F9A8D4">Three.js / 3D</text>
      </g>
    </g>
  </g>

  <!-- Right Decorative Terminal / Spotlight Window -->
  <g transform="translate(830, 44)" class="float-card">
    <rect width="320" height="252" rx="14" fill="#090D16" fill-opacity="0.9" stroke="#334155" stroke-width="1.2"/>
    <rect width="320" height="34" rx="14" fill="#111827"/>
    <rect y="20" width="320" height="14" fill="#111827"/>
    <line x1="0" y1="34" x2="320" y2="34" stroke="#1E293B" stroke-width="1"/>

    <!-- Window Controls -->
    <circle cx="18" cy="17" r="5" fill="#EF4444"/>
    <circle cx="34" cy="17" r="5" fill="#F59E0B"/>
    <circle cx="50" cy="17" r="5" fill="#10B981"/>
    <text x="160" y="21" text-anchor="middle" class="code-title">pandu@profile ~</text>

    <!-- Code Content -->
    <g transform="translate(20, 58)">
      <text x="0" y="0" class="code-line" fill="#64748B">// Featured Engineering Work</text>
      <text x="0" y="24" class="code-line">
        <tspan fill="#C084FC">const</tspan> <tspan fill="#38BDF8">spotlight</tspan> <tspan fill="#94A3B8">=</tspan> <tspan fill="#FDE047">[</tspan>
      </text>

      <g transform="translate(14, 48)">
        <rect x="-4" y="-14" width="268" height="32" rx="6" fill="#1E293B" fill-opacity="0.5"/>
        <circle cx="8" cy="2" r="4" fill="#FB923C"/>
        <text x="20" y="6" class="code-line" fill="#F8FAFC">"CalculatorSwift"</text>
        <text x="160" y="6" class="code-line" fill="#94A3B8">SwiftUI · 3D</text>
      </g>

      <g transform="translate(14, 88)">
        <rect x="-4" y="-14" width="268" height="32" rx="6" fill="#1E293B" fill-opacity="0.5"/>
        <circle cx="8" cy="2" r="4" fill="#F472B6"/>
        <text x="20" y="6" class="code-line" fill="#F8FAFC">"pastel-tycoon"</text>
        <text x="160" y="6" class="code-line" fill="#94A3B8">Three.js · Sim</text>
      </g>

      <g transform="translate(14, 128)">
        <rect x="-4" y="-14" width="268" height="32" rx="6" fill="#1E293B" fill-opacity="0.5"/>
        <circle cx="8" cy="2" r="4" fill="#34D399"/>
        <text x="20" y="6" class="code-line" fill="#F8FAFC">"PrivaTalk"</text>
        <text x="160" y="6" class="code-line" fill="#94A3B8">Local AI · RN</text>
      </g>

      <text x="0" y="164" class="code-line">
        <tspan fill="#FDE047">]</tspan><tspan fill="#94A3B8">;</tspan>
      </text>
      <text x="0" y="184" class="code-line" fill="#10B981">▸ status: shipping_code ✓</text>
    </g>
  </g>
</svg>
