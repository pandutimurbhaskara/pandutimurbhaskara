<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="100%">
  <defs>
    <clipPath id="bannerClip">
      <rect width="1200" height="240" rx="16"/>
    </clipPath>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="60%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="topBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>

    <radialGradient id="subtleGlow" cx="85%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.55"/>
    </pattern>

    <style>
      .eyebrow { font: 600 12px 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; fill: #94A3B8; letter-spacing: 1.5px; }
      .name { font: 700 40px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #F8FAFC; letter-spacing: -0.6px; }
      .bio { font: 400 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #94A3B8; }
      .bio-strong { fill: #E2E8F0; font-weight: 500; }
      .chip { font: 500 12.5px 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; fill: #CBD5E1; }
      .side-label { font: 600 11px 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; fill: #64748B; letter-spacing: 1.2px; }
      .side-repo { font: 600 13.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #E2E8F0; }
      .side-sub { font: 400 12px 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; fill: #94A3B8; }
    </style>
  </defs>

  <g clip-path="url(#bannerClip)">
    <!-- Background -->
    <rect width="1200" height="240" fill="url(#bgGrad)"/>
    <rect width="1200" height="240" fill="url(#dotGrid)"/>
    <rect width="1200" height="240" fill="url(#subtleGlow)"/>

    <!-- Top 3px Accent Strip (clipped cleanly inside rounded corners) -->
    <rect x="0" y="0" width="1200" height="3" fill="url(#topBar)"/>

    <!-- Left Content -->
    <g transform="translate(48, 44)">
      <g transform="translate(0, 0)">
        <circle cx="5" cy="-4" r="3.5" fill="#10B981"/>
        <text x="16" y="0" class="eyebrow">NANOVEST  ·  YOGYAKARTA, INDONESIA</text>
      </g>

      <text x="0" y="50" class="name">Pandu Timur Bhaskara</text>

      <text x="0" y="84" class="bio">
        <tspan class="bio-strong">Fullstack &amp; Mobile Engineer</tspan> building web apps, native mobile tools, and side projects.
      </text>

      <!-- Stack Chips -->
      <g transform="translate(0, 114)">
        <rect x="0" y="0" width="166" height="30" rx="6" fill="#161F30" stroke="#334155" stroke-width="1"/>
        <text x="83" y="19.5" text-anchor="middle" class="chip">React / React Native</text>

        <rect x="176" y="0" width="132" height="30" rx="6" fill="#161F30" stroke="#334155" stroke-width="1"/>
        <text x="242" y="19.5" text-anchor="middle" class="chip">Swift &amp; SwiftUI</text>

        <rect x="318" y="0" width="140" height="30" rx="6" fill="#161F30" stroke="#334155" stroke-width="1"/>
        <text x="388" y="19.5" text-anchor="middle" class="chip">Kotlin &amp; Flutter</text>

        <rect x="468" y="0" width="138" height="30" rx="6" fill="#161F30" stroke="#334155" stroke-width="1"/>
        <text x="537" y="19.5" text-anchor="middle" class="chip">TypeScript &amp; Go</text>

        <rect x="616" y="0" width="96" height="30" rx="6" fill="#161F30" stroke="#334155" stroke-width="1"/>
        <text x="664" y="19.5" text-anchor="middle" class="chip">Three.js</text>
      </g>
    </g>

    <!-- Right Divider & Recent Builds Card -->
    <line x1="810" y1="36" x2="810" y2="204" stroke="#1E293B" stroke-width="1.5"/>

    <g transform="translate(842, 42)">
      <text x="0" y="6" class="side-label">RECENT PROJECTS</text>

      <!-- Item 1 -->
      <g transform="translate(0, 22)">
        <rect x="0" y="0" width="310" height="38" rx="8" fill="#131B2E" stroke="#1E293B" stroke-width="1"/>
        <circle cx="16" cy="19" r="4" fill="#F97316"/>
        <text x="30" y="23.5" class="side-repo">CalculatorSwift</text>
        <text x="296" y="23.5" text-anchor="end" class="side-sub">Swift 6 · SwiftUI</text>
      </g>

      <!-- Item 2 -->
      <g transform="translate(0, 68)">
        <rect x="0" y="0" width="310" height="38" rx="8" fill="#131B2E" stroke="#1E293B" stroke-width="1"/>
        <circle cx="16" cy="19" r="4" fill="#F472B6"/>
        <text x="30" y="23.5" class="side-repo">pastel-tycoon</text>
        <text x="296" y="23.5" text-anchor="end" class="side-sub">Three.js · TypeScript</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 114)">
        <rect x="0" y="0" width="310" height="38" rx="8" fill="#131B2E" stroke="#1E293B" stroke-width="1"/>
        <circle cx="16" cy="19" r="4" fill="#10B981"/>
        <text x="30" y="23.5" class="side-repo">PrivaTalk</text>
        <text x="296" y="23.5" text-anchor="end" class="side-sub">React Native · Local AI</text>
      </g>
    </g>

    <!-- Clean Inner Border -->
    <rect x="0.75" y="0.75" width="1198.5" height="238.5" rx="15.25" fill="none" stroke="#30363D" stroke-width="1.5"/>
  </g>
</svg>
